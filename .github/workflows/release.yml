name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          V="${GITHUB_REF_NAME#v}"
          for f in src/e1/module.json; do
            grep -q "\"version\": \"$V\"" "$f" || { echo "$f is not at version $V"; exit 1; }
          done
      - run: make test
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          bash scripts/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/e1-module.tar.gz
      - name: Update release.json on main
        run: |
          V="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          git fetch origin main && git checkout -f main
          cat > release.json <<JSON
          {
            "modules": {
              "e1": { "version": "$V", "download_url": "$BASE/e1-module.tar.gz" }
            }
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release.json
          git commit -m "Release ${GITHUB_REF_NAME}" || echo "no change"
          git push origin main
