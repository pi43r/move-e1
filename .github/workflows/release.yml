name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # Run from the Actions tab: tags the version in module.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the tag
        run: |
          V=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' src/e1/module.json)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$V" ] || { echo "module.json is at $V, tag is $GITHUB_REF_NAME"; exit 1; }
          fi
          echo "TAG=v$V" >> "$GITHUB_ENV"
      - run: make test
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          bash scripts/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/e1-module.tar.gz
      - name: Update release.json on main
        run: |
          V="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          git fetch origin main && git checkout -f main
          cat > release.json <<JSON
          {
            "modules": {
              "e1": { "version": "$V", "download_url": "$BASE/e1-module.tar.gz" }
            }
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release.json
          git commit -m "Release ${TAG}" || echo "no change"
          git push origin main
