name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: make test
      - name: Cross-compile for Move
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: e1-module
          path: dist/e1-module.tar.gz
